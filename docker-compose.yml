version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: whatsapp_ai_mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: whatsapp_fashion_db
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: whatsapp_ai_redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: whatsapp_ai_backend
    restart: always
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=mongodb://mongodb:27017/whatsapp_fashion_db
      - MONGODB_DB_NAME=whatsapp_fashion_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - mongodb
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: whatsapp_ai_frontend
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  mongo_data:
